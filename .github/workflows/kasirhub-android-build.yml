name: Build KasirHub Android

on:
  workflow_dispatch:
  push:
    branches: [ kasirhub-android-only-v2.1.0 ]
    paths:
      - 'kasirhub-android-only-v2.1.0/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        working-directory: kasirhub-android-only-v2.1.0
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasirhub-android-debug
          path: kasirhub-android-only-v2.1.0/app/build/outputs/apk/debug/app-debug.apk
