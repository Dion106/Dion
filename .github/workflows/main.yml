name: Build Wakatobi Karaoke Universal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Universal ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -type f \
            -iname 'Wakatobi-Karaoke-Universal*.zip' \
            -printf '%T@ %p\n' 2>/dev/null |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP Universal tidak ditemukan."
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Universal ZIP: $ZIP"

      - name: Extract Universal Project
        shell: bash
        run: |
          rm -rf universal-project
          mkdir -p universal-project

          unzip -q "${{ steps.zip.outputs.ZIP }}" \
            -d universal-project

          echo "Isi project:"
          find universal-project -maxdepth 4 -type f \
            | sort | head -200

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find universal-project \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -printf '%h\n' |
            head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Universal APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        shell: bash
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.PROJECT_DIR }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" |
            head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            find universal-project \
              -type f \
              -name "*.apk" -print
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "APK ditemukan: $APK"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp "${{ steps.apk.outputs.APK }}" \
            release/wakatobi-karaoke-universal.apk

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wakatobi-karaoke-universal
          path: release/wakatobi-karaoke-universal.apk
          if-no-files-found: error
